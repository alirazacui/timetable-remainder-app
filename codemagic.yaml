workflows:
    android-apk:
        name: Lecture Reminder - Android APK
        max_build_duration: 30
        environment:
            flutter: stable
        scripts:
          - name: Generate missing android/ios platform files
            script: |
                if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
                  flutter create . --platforms=android --org com.alirazacui.timetablereminder
                fi
          - name: Add notification permissions to AndroidManifest
            script: |
                python3 - <<'PY'
                import re
                path = "android/app/src/main/AndroidManifest.xml"
                with open(path) as f:
                    content = f.read()
                if "SCHEDULE_EXACT_ALARM" not in content:
                    content = re.sub(
                        r'(<manifest[^>]*>)',
                        r'\1\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
                        content,
                        count=1,
                    )
                    with open(path, "w") as f:
                        f.write(content)
                PY
          - name: Enable core library desugaring for flutter_local_notifications
            script: |
                python3 - <<'PY'
                import os, re

                groovy_path = "android/app/build.gradle"
                kts_path = "android/app/build.gradle.kts"
                desugar_dep = "com.android.tools:desugar_jdk_libs:2.0.4"

                if os.path.exists(kts_path):
                    path = kts_path
                    with open(path) as f:
                        content = f.read()
                    if "isCoreLibraryDesugaringEnabled" not in content:
                        content = re.sub(
                            r'(compileOptions\s*\{)',
                            r'\1\n        isCoreLibraryDesugaringEnabled = true',
                            content, count=1,
                        )
                    if "coreLibraryDesugaring" not in content:
                        if re.search(r'\ndependencies\s*\{', content):
                            content = re.sub(
                                r'(\ndependencies\s*\{)',
                                r'\1\n    coreLibraryDesugaring("%s")' % desugar_dep,
                                content, count=1,
                            )
                        else:
                            content += '\ndependencies {\n    coreLibraryDesugaring("%s")\n}\n' % desugar_dep
                    with open(path, "w") as f:
                        f.write(content)
                elif os.path.exists(groovy_path):
                    path = groovy_path
                    with open(path) as f:
                        content = f.read()
                    if "coreLibraryDesugaringEnabled" not in content:
                        content = re.sub(
                            r'(compileOptions\s*\{)',
                            r'\1\n        coreLibraryDesugaringEnabled true',
                            content, count=1,
                        )
                    if "coreLibraryDesugaring" not in content:
                        if re.search(r'\ndependencies\s*\{', content):
                            content = re.sub(
                                r'(\ndependencies\s*\{)',
                                r"\1\n    coreLibraryDesugaring '%s'" % desugar_dep,
                                content, count=1,
                            )
                        else:
                            content += "\ndependencies {\n    coreLibraryDesugaring '%s'\n}\n" % desugar_dep
                    with open(path, "w") as f:
                        f.write(content)
                PY
          - name: Add ML Kit text-recognition language dependencies
            script: |
                python3 - <<'PY'
                import os, re

                groovy_path = "android/app/build.gradle"
                kts_path = "android/app/build.gradle.kts"
                dependencies = [
                    "com.google.mlkit:text-recognition-chinese:16.0.1",
                    "com.google.mlkit:text-recognition-devanagari:16.0.1",
                    "com.google.mlkit:text-recognition-japanese:16.0.1",
                    "com.google.mlkit:text-recognition-korean:16.0.1",
                ]

                def add_dependencies(content: str, block_pattern: str, formatter) -> str:
                    if all(dep in content for dep in dependencies):
                        return content
                    if re.search(block_pattern, content):
                        injection = ''.join(formatter(dep) for dep in dependencies if dep not in content)
                        content = re.sub(block_pattern, r'\1' + injection, content, count=1)
                    else:
                        content += '\ndependencies {\n' + ''.join(formatter(dep) for dep in dependencies if dep not in content) + '}\n'
                    return content

                if os.path.exists(kts_path):
                    with open(kts_path) as f:
                        content = f.read()
                    content = add_dependencies(
                        content,
                        r'(dependencies\s*\{)',
                        lambda dep: f'\n    implementation("{dep}")',
                    )
                    with open(kts_path, "w") as f:
                        f.write(content)
                elif os.path.exists(groovy_path):
                    with open(groovy_path) as f:
                        content = f.read()
                    content = add_dependencies(
                        content,
                        r'(dependencies\s*\{)',
                        lambda dep: f"\n    implementation '{dep}'",
                    )
                    with open(groovy_path, "w") as f:
                        f.write(content)
                PY
          - name: Get Flutter packages
            script: flutter pub get
          - name: Build APK (release)
            script: flutter build apk --release
        artifacts:
          - build/app/outputs/**/*.apk
