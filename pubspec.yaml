name: timetable_reminder
description: Reads your class timetable + bell timings and reminds you before each lecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  intl: ^0.19.0
  uuid: ^4.4.0

  # PDF import feature
  file_picker: ^8.1.2
  syncfusion_flutter_pdf: ^27.1.48
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
